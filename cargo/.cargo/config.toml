[build]
target = "{{ rust_target }}"
{%- if windows %}
# Keep deeply nested intermediate artifacts at a short physical path on
# Windows. The workspace hash makes this safe to share between projects.
build-dir = "C:/e/{workspace-path-hash}"
{%- endif %}

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "{{ mcu }}"
ESP_IDF_VERSION = "{{ espidfver }}"
ESP_IDF_TOOLS_INSTALL_DIR = "{{ installdir }}"

{%- if windows %}
# build-dir is outside the project, so explicitly tell embuild where the
# workspace and its sdkconfig.defaults are located.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
{%- else %}
# Uncomment this if you move the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
#CARGO_WORKSPACE_DIR = { value = "", relative = true }
{%- endif %}
